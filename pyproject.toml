[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcsfekorea"
authors = [{ name = "fieryhenry" }]
description = "냥코 대전쟁 세이브 에디터 (BCSFE) 비공식 한국어판 - Unofficial Korean edition of BCSFE"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Operating System :: OS Independent",
]
dependencies = ["pyjwt", "requests", "pyyaml", "argparse"]
dynamic = ["version"]
keywords = ["battle cats", "save editor", "korean", "냥코 대전쟁"]

[project.urls]
Homepage = "https://github.com/hxsun9/bcsfekorea"
Repository = "https://github.com/hxsun9/bcsfekorea"
Issues = "https://github.com/hxsun9/bcsfekorea/issues"
Original = "https://codeberg.org/fieryhenry/BCSFE-Python"

[tool.setuptools.dynamic]
version = { attr = "bcsfe.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pyright]
typeCheckingMode = "strict"

[project.scripts]
bcsfe = "bcsfe:run"
bcsfekorea = "bcsfe:run"

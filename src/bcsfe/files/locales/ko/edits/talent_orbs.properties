edit_orbs_help=
>도움말 (입력은 영어 단어로 합니다):
>사용 가능한 등급: {all_grades_str}
>사용 가능한 속성: {all_attributes_str}
>사용 가능한 효과: {all_effects_str}
><@w>참고: 모든 속성에 모든 등급과 효과가 있는 것은 아닙니다.</>
>입력 예시:
>    <c>aku</> - <c>악마(aku) 속성</> 구슬 전부 선택
>    <r>red</> <b>s</> - <r>빨간 적(red)</> 구슬 중 <b>s</> 등급 전부 선택
>    <b>alien</> <r>d</> <r>0</> - <b>에일리언(alien)</> 구슬 중 <r>d</> 등급의 <r>공격력</> 증가 구슬 선택
>    <o>c</> <dm>1</> - <o>c</> 등급의 레전드 스토리 부스트 구슬 선택
><@q>모든</> 구슬을 선택하려면 다음을 입력하세요:
>    <@q>*</>
><@q>여러 개를 동시에</> 선택하려면 <@q>쉼표</>로 구분하세요:
>    <b>s</> <bl>black</> <g>4</>,<r>d</> <o>3</>,<g>floating</>
>

welcome=
><@t>==================== <@s>냥코 대전쟁 세이브 에디터 (한국어판)</> ====================</>
>원작: <@s>fieryhenry</> (<@s>https://codeberg.org/fieryhenry/BCSFE-Python</>) | 무료 오픈소스 프로그램입니다
>
><@q>[빠른 사용법]</>
> <@s>1.</> 게임에서 [기종 변경]을 눌러 <@s>인계 코드</>와 <@s>인증 번호</>를 받습니다 (한국판 국가 코드: <@s>kr</>)
> <@s>2.</> 아래 메뉴에서 <@s>1번</>을 고르고 코드를 입력해 세이브를 불러옵니다
> <@s>3.</> 번호를 입력하거나 <@s>통조림</>, <@s>XP</>, <@s>캐릭터</> 처럼 단어로 검색해 수정합니다
> <@s>4.</> 다 고쳤으면 <@s>세이브 관리</> → <@s>서버에 업로드</>를 골라 새 코드를 받아 게임에 입력합니다
> 예/아니요 질문은 <@s>y</> / <@s>n</>, 여러 개 선택은 <@s>1 2 3</> / <@s>1-10</> / <@s>all</>, 취소는 <@s>q</>
>
><@w>주의: 본인 책임하에 사용하세요. 통조림·티켓 등을 너무 많이 넣으면 계정이 정지될 수 있습니다.
>수정하기 전에 세이브를 백업해 두세요 (에디터가 자동 백업도 만들어 둡니다).</>
>
